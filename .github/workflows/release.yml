name: Windows Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows package
        shell: pwsh
        run: ./scripts/build_windows.ps1
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: anime-sub-ai-windows
          path: dist/anime-sub-ai-windows.zip
      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" dist/anime-sub-ai-windows.zip --title "${{ github.ref_name }}" --notes-file CHANGELOG.md
