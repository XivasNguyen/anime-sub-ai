[project]
name = "anime-sub-ai"
version = "0.3.0"
description = "Local-first anime subtitle AI pipeline MVP"
requires-python = ">=3.12"
dependencies = [
  "openai>=1.80.0",
  "httpx>=0.28.1",
  "fastapi>=0.115.0",
  "jinja2>=3.1.4",
  "pysubs2>=1.8.0",
  "PyYAML>=6.0.2",
  "typer>=0.12.5",
  "uvicorn>=0.32.0",
  "faster-whisper>=1.1.0",
]

[project.scripts]
anime-sub = "app.cli.main:app"
