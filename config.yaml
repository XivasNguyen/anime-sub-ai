provider: lmstudio

openai:
  api_key: env:OPENAI_API_KEY
  model: gpt-5

ollama:
  base_url: env:OLLAMA_BASE_URL
  model: env:OLLAMA_MODEL

lmstudio:
  base_url: http://127.0.0.1:1234/v1
  model: qwen2.5-7b-instruct-1m
  api_key: lm-studio

translation:
  chunk_size: 8
  overlap_lines: 2
  max_concurrency: 1
  retry_count: 3

mux:
  set_default_subtitle: true
  subtitle_language: vie
  subtitle_track_name: Vietnamese AI

output:
  directory: output
  temp_directory: temp

cache:
  enabled: true
  path: cache/translation_memory.sqlite

knowledge:
  enabled: false
  cache_directory: cache/knowledge
  spoiler_mode: no_spoiler
  enable_web: false
