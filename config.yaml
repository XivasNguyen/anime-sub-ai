provider: openai

openai:
  api_key: env:OPENAI_API_KEY
  model: gpt-5

ollama:
  base_url: env:OLLAMA_BASE_URL
  model: env:OLLAMA_MODEL

lmstudio:
  base_url: env:LMSTUDIO_BASE_URL
  model: env:LMSTUDIO_MODEL
  api_key: env:LMSTUDIO_API_KEY

translation:
  chunk_size: 12
  overlap_lines: 2
  max_concurrency: 3
  retry_count: 3

mux:
  set_default_subtitle: true
  subtitle_language: vie
  subtitle_track_name: Vietnamese AI

output:
  directory: output
  temp_directory: temp
